# yaml-language-server: $schema=../schema/moat.schema.json
#
# Recipe (FR-43): newsletter sign-up on your website → HubSpot contact.
# The HubSpot token is never written here: seal it with `moat secret seal <gate> hubspot-token`.
version: 1

upstreams:
  hubspot:
    origin: 'https://api.hubapi.com'
    auth:
      type: bearer
      secret: hubspot-token
    timeout: '10s'

routes:
  newsletter:
    method: POST
    path: '/newsletter'
    upstream: hubspot
    upstreamPath: '/crm/v3/objects/contacts'
    maxBodySize: '4KiB'
    # A sign-up form needs few requests per visitor (FR-30).
    rateLimit:
      requests: 5
      window: '10m'
    # At most this many sign-ups a day in total, from whoever sends them (FR-31).
    quota:
      requests: 500
      period: day
    # Only these fields reach HubSpot (FR-13): anything else the form sends is removed, and a
    # sign-up without a valid e-mail is refused with 400 body_invalid.
    body:
      properties:
        type: object
        required: true
        fields:
          email:
            type: string
            required: true
            format: email
            maxLength: 254
          firstname:
            type: string
            maxLength: 100
          lastname:
            type: string
            maxLength: 100
    # When the form runs on another site than the gate, list that site (FR-15):
    # origins: ['https://www.example.ch']

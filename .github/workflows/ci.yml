# CI only calls the gates defined in package.json (CLAUDE.md, CI): add checks there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install yamllint
        run: pip install yamllint==1.37.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  gate-php:
    name: gate-php (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          # Exactly the extensions the gate needs on shared hosting (CLAUDE.md, Gate PHP).
          extensions: none, ctype, dom, mbstring, tokenizer, xml, xmlwriter, phar, filter, iconv, sodium, curl, json, hash, openssl
          coverage: none
          tools: composer:v2
      - run: composer --working-dir=gates/php install --no-interaction --no-progress
      - run: composer --working-dir=gates/php check

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
      # Pinned by version, checked by Go's module checksum database; the runner has Go.
      - name: Install helm and kubeconform
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.16.4
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: node scripts/check-helm.mjs
        env:
          CI: 'true'

  image:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start the image once
        run: |
          docker build -f deploy/docker/Dockerfile -t moat-cloud:ci .
          sh scripts/smoke-image.sh moat-cloud:ci
      # The flows need libsodium (pnpm install) and, for the real gate, PHP and the built gate file.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: none, ctype, tokenizer, sodium, curl, json, hash
          coverage: none
          tools: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:gate-php
      - name: A real flow against the image, and the real PHP gate against the Cloud
        run: sh scripts/smoke-flow-image.sh moat-cloud:ci

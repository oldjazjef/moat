# Moat Cloud, self-hosted: the server (API + dashboard) and PostgreSQL. See README.md.
#
#   ./init-secrets.sh            # once: generates secrets/ (never committed)
#   cp .env.example .env         # then set MOAT_PUBLIC_ORIGIN
#   docker compose up -d --build
#
# Secrets are Docker secrets (files under ./secrets), never environment values. TLS for the
# browser is the reverse proxy's job; the database connection is TLS with a verified certificate
# (the Cloud refuses anything else towards another host).

name: moat-cloud

services:
  moat-cloud:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: moat-cloud:local
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOAT_PUBLIC_ORIGIN: ${MOAT_PUBLIC_ORIGIN:?set MOAT_PUBLIC_ORIGIN in .env (https://…)}
      MOAT_COOKIE_SECURE: ${MOAT_COOKIE_SECURE:-true}
      MOAT_TRUST_PROXY: ${MOAT_TRUST_PROXY:-1}
      MOAT_DB_PROVIDER: postgresql
      MOAT_ACCOUNT_KEY_FILE: /run/secrets/moat_account_key
      MOAT_DATABASE_URL_FILE: /run/secrets/moat_database_url
      # The CA that signed the database's certificate (init-secrets.sh), for the verified TLS.
      NODE_EXTRA_CA_CERTS: /run/secrets/db_ca
    secrets:
      - moat_account_key
      - moat_database_url
      - db_ca
    ports:
      # Only this machine by default: the reverse proxy in front terminates TLS.
      - '${MOAT_BIND:-127.0.0.1}:${MOAT_PORT:-3000}:3000'
    networks:
      - frontend
      - backend
    volumes:
      - moat-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    # Pinned by tag; pin the digest at release time (docker buildx imagetools inspect <tag>).
    image: postgres:17-bookworm
    init: true
    restart: unless-stopped
    # The mounted key file is not postgres-owned, which PostgreSQL refuses: start.sh copies it
    # into a tmpfs with the right owner and mode, then runs the image's own entrypoint with TLS on.
    entrypoint: ['/bin/sh', '/start.sh']
    environment:
      POSTGRES_USER: moat
      POSTGRES_DB: moat
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db_password
      - db_tls_cert
      - db_tls_key
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-start.sh:/start.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /run/postgresql:mode=1777
      - /run/tls:mode=0755
    # The image starts as root and drops to the postgres user; nothing else is kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moat -d moat -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

networks:
  frontend: {}
  # No route out: the database cannot be reached from outside and cannot reach anything.
  backend:
    internal: true

volumes:
  moat-data: {}
  postgres-data: {}

secrets:
  moat_account_key:
    file: ./secrets/moat_account_key
  moat_database_url:
    file: ./secrets/moat_database_url
  db_password:
    file: ./secrets/db_password
  db_ca:
    file: ./secrets/db_ca.crt
  db_tls_cert:
    file: ./secrets/db_server.crt
  db_tls_key:
    file: ./secrets/db_server.key

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moat-cloud.serviceAccountName" . }}
  labels:
    {{- include "moat-cloud.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod talks to no Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}

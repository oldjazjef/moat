apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moat-cloud.fullname" . }}
  labels:
    {{- include "moat-cloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moat-cloud.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "moat-cloud.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "moat-cloud.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moat-cloud
          image: {{ include "moat-cloud.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            - name: AUTH_MODE
              value: cloud
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: MOAT_WEB_DIR
              value: /app/web
            - name: MOAT_PUBLIC_ORIGIN
              value: {{ required "publicOrigin is required (https://…, no path)" .Values.publicOrigin | quote }}
            - name: MOAT_COOKIE_SECURE
              value: 'true'
            - name: MOAT_TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: MOAT_DB_PROVIDER
              value: postgresql
            - name: MOAT_ACCOUNT_KEY_FILE
              value: /run/secrets/moat_account_key
            - name: MOAT_DATABASE_URL_FILE
              value: /run/secrets/moat_database_url
            - name: NODE_EXTRA_CA_CERTS
              value: /run/secrets/db_ca.crt
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        # Three Secrets as files under one folder; the keys are renamed to the file names the
        # server is told about above. Mode 288 (= 0440) with fsGroup 1000 = readable by the process only.
        - name: secrets
          projected:
            defaultMode: 288 # = 0440 octal
            sources:
              - secret:
                  name: {{ required "secrets.accountKey.name is required" .Values.secrets.accountKey.name | quote }}
                  items:
                    - key: {{ .Values.secrets.accountKey.key | quote }}
                      path: moat_account_key
              - secret:
                  name: {{ required "secrets.databaseUrl.name is required" .Values.secrets.databaseUrl.name | quote }}
                  items:
                    - key: {{ .Values.secrets.databaseUrl.key | quote }}
                      path: moat_database_url
              - secret:
                  name: {{ required "secrets.databaseCa.name is required" .Values.secrets.databaseCa.name | quote }}
                  items:
                    - key: {{ .Values.secrets.databaseCa.key | quote }}
                      path: db_ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: data
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "moat-cloud.fullname" . }}
  labels:
    {{- include "moat-cloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when the ingress is enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required: the dashboard is served over TLS only" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "moat-cloud.fullname" . }}
                port:
                  name: http
{{- end }}

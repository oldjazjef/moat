# Integrated Nx workspace, as in lazy-koins: every dependency lives in the root manifest and apps
# carry no package.json of their own. `apps/*` is listed for the day one of them needs to become a
# real package; today it matches nothing, which is fine.
packages:
  - 'apps/*'

# pnpm 10+ refuses to run dependency install scripts unless they are allowlisted here.
#   nx                 own postinstall
#   @swc/core          @swc-node/register, used by Nx to execute TS config files
#   @parcel/watcher    Nx file watching
#   lmdb, msgpackr-extract  Nx task cache
#   unrs-resolver      native module resolver behind eslint-plugin-import
#   esbuild            pulled in by vite (vitest) and Angular's bundler (@angular/build)
#   less               pulled in by @angular/build's stylesheet pipeline
#   electron           downloads the Electron binary (apps/desktop, `pnpm start:desktop`)
#   prisma, @prisma/engines  the CLI's schema-engine binary, needed by `prisma migrate diff`
#                      (authoring migrations, dev only; the app applies them without the CLI)
#
# The `false` entries are deliberate: `@nestjs/core` only prints a sponsorship notice,
# `electron-winstaller` (via electron-builder) is Squirrel.Windows, unused: the desktop app ships NSIS.
# `ssh2` (SFTP deploy, DT-05) and `cpu-features` would compile optional native crypto; the desktop
# uses ssh2's pure-JS path on Node's own crypto, so the packaged app keeps no native module.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  electron: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
  '@nestjs/core': false
  electron-winstaller: false
  ssh2: false
  cpu-features: false

# Nx is pinned to one exact version; keep @nx/devkit in step with it (see lazy-koins).
overrides:
  '@nx/devkit': 23.2.1
  nx: 23.2.1
  # Transitive packages with published advisories (pnpm audit, 26.10.2026): raised to the patched
  # release within the same major. Remove an entry once the package that pulls it in has moved on.
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  smol-toml: ^1.8.1
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  axios: ^1.20.0
  follow-redirects: ^1.16.1
  'vite@>=8.3.0 <8.3.3': ^8.3.3
  '@vitest/mocker@<4.1.12': ^4.1.12
  'zod@<4.6.6': ^4.6.6
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'undici@>=6.0.0 <6.29.1': ^6.29.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  serialize-javascript: ^7.1.3
  multer: ^2.5.0
  fast-uri: ^3.1.9

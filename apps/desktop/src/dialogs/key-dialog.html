<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No script on this page: its preload renders the view with textContent. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="dialog.css" />
    <title>Moat</title>
  </head>
  <body>
    <form id="form" hidden>
      <h1 id="title"></h1>
      <p id="intro" class="muted"></p>
      <fieldset>
        <label for="passphrase" id="passphrase-label" class="label"></label>
        <input
          id="passphrase"
          type="password"
          autocomplete="new-password"
          spellcheck="false"
        />
        <label for="repeat" id="repeat-label" class="label"></label>
        <input
          id="repeat"
          type="password"
          autocomplete="new-password"
          spellcheck="false"
        />
        <p id="hint" class="muted small"></p>
        <label class="check">
          <input id="show" type="checkbox" />
          <span id="show-label"></span>
        </label>
      </fieldset>
      <p id="working" class="muted" role="status" hidden></p>
      <p id="notice" class="error" role="alert" hidden></p>
      <div class="buttons">
        <button id="cancel" type="button" class="secondary"></button>
        <button id="create" type="submit"></button>
      </div>
    </form>
  </body>
</html>

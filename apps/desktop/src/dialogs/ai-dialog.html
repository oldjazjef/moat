<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No script on this page: its preload renders the view with textContent. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="dialog.css" />
    <title>Moat</title>
  </head>
  <body>
    <form id="form" hidden>
      <h1 id="title"></h1>
      <p id="intro" class="muted"></p>
      <fieldset>
        <label class="stack">
          <span id="kind-label" class="label"></span>
          <select id="kind">
            <option id="kind-anthropic" value="anthropic"></option>
            <option id="kind-openai" value="openai_compatible"></option>
          </select>
        </label>
        <label class="stack">
          <span id="url-label" class="label"></span>
          <input id="url" type="text" autocomplete="off" spellcheck="false" />
          <span id="url-hint" class="muted small"></span>
        </label>
        <label class="stack">
          <span id="model-label" class="label"></span>
          <input id="model" type="text" autocomplete="off" spellcheck="false" />
          <span id="model-hint" class="muted small"></span>
        </label>
        <label class="stack">
          <span id="key-label" class="label"></span>
          <input
            id="key"
            type="password"
            autocomplete="off"
            spellcheck="false"
          />
          <span id="key-hint" class="muted small"></span>
          <span id="key-stored" class="muted small" hidden></span>
        </label>
      </fieldset>
      <p id="notice" role="status" hidden></p>
      <div class="buttons">
        <button id="forget" type="button" class="secondary"></button>
        <button id="close" type="button" class="secondary"></button>
        <button id="save" type="submit"></button>
      </div>
    </form>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No script on this page: its preload renders the view with textContent (DT-15). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="dialog.css" />
    <title>Moat</title>
  </head>
  <body>
    <form id="form" hidden>
      <h1 id="title"></h1>
      <p id="intro" class="muted"></p>
      <dl class="facts">
        <dt id="project-label"></dt>
        <dd id="project"></dd>
        <dt id="gate-label"></dt>
        <dd id="gate" class="code"></dd>
        <dt id="version-label"></dt>
        <dd id="version"></dd>
      </dl>
      <h2 id="changes-label"></h2>
      <p id="unverified" class="warning" hidden></p>
      <ul id="changes"></ul>
      <p id="locked" class="warning" hidden></p>
      <fieldset>
        <div class="row">
          <span id="key-label" class="label"></span>
          <span id="key" class="code"></span>
          <button id="choose-key" type="button" class="secondary"></button>
        </div>
        <label for="passphrase" id="passphrase-label" class="label"></label>
        <input
          id="passphrase"
          type="password"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="remembered" class="muted small" hidden></p>
        <label id="remember-row" class="check" hidden>
          <input id="remember" type="checkbox" />
          <span id="remember-label"></span>
        </label>
      </fieldset>
      <p id="notice" class="error" role="alert" hidden></p>
      <div class="buttons">
        <button id="cancel" type="button" class="secondary"></button>
        <button id="sign" type="submit"></button>
      </div>
    </form>
  </body>
</html>
